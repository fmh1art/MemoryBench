<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MemoryBench · 评估查看</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <span class="brand-mark">M</span><strong>MemoryBench</strong
        ><span class="muted"> / Case review</span>
      </div>
      <div id="overview" class="overview"></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <label class="field"
          >搜索 case 或目标物体<input
            id="search"
            type="search"
            placeholder="名称、物体、动作…"
            autocomplete="off"
        /></label>
        <label class="field"
          >类别<select id="category">
            <option value="">全部类别</option>
          </select></label
        >
        <div class="filter-row">
          <label class="field"
            >状态<select id="status">
              <option value="">全部状态</option>
              <option value="scored">有效评分</option>
              <option value="gate_failed">Gate 未通过</option>
              <option value="insufficient_evidence">证据不足</option>
              <option value="error">评估错误</option>
            </select></label
          >
          <label class="field"
            >排序<select id="sort">
              <option value="name">Case 名称</option>
              <option value="low">分数从低到高</option>
              <option value="high">分数从高到低</option>
            </select></label
          >
        </div>
        <div class="list-heading">
          <span id="count"></span><span>Memory / 1</span>
        </div>
        <nav id="case-list" aria-label="评估样本列表"></nav>
      </aside>
      <main id="main" aria-busy="true">
        <div id="message" role="status">正在加载评估结果…</div>
        <div id="detail" hidden>
          <section class="case-heading">
            <div>
              <div id="case-category" class="eyebrow"></div>
              <h1 id="case-title"></h1>
              <div id="case-status"></div>
            </div>
            <div class="navigation">
              <button id="prev" title="上一条（←）">← 上一条</button
              ><span id="position"></span
              ><button id="next" title="下一条（→）">下一条 →</button>
            </div>
          </section>
          <section class="context">
            <div>
              <span class="label">Memory target</span>
              <p id="target"></p>
            </div>
            <div>
              <span class="label">Read action</span>
              <p id="action"></p>
              <p id="read-window" class="muted small"></p>
            </div>
          </section>
          <section
            id="score-cards"
            class="score-cards"
            aria-label="维度分数"
          ></section>
          <p id="score-note" class="small muted"></p>
          <section class="visual-panel">
            <div class="visual-toolbar">
              <div class="tabs" role="tablist" aria-label="对照方式">
                <button
                  id="tab-sheets"
                  role="tab"
                  data-view="sheets"
                  aria-selected="true"
                >
                  拼图对照</button
                ><button
                  id="tab-frames"
                  role="tab"
                  data-view="frames"
                  aria-selected="false"
                >
                  逐帧放大</button
                ><button
                  id="tab-videos"
                  role="tab"
                  data-view="videos"
                  aria-selected="false"
                >
                  同步视频
                </button>
              </div>
              <button id="expand-sheet">放大拼图 ↗</button>
            </div>
            <div id="view-sheets" role="tabpanel">
              <figure>
                <figcaption>
                  <span class="reference">GT · Reference</span
                  ><span>真实世界状态</span>
                </figcaption>
                <img id="gt-sheet" alt="GT 视频的 12 帧拼图" />
              </figure>
              <figure>
                <figcaption>
                  <span class="generated">Gen · Generated</span
                  ><span>生成结果</span>
                </figcaption>
                <img id="gen-sheet" alt="生成视频的 12 帧拼图" />
              </figure>
              <p class="small muted">
                上下两张图的对应帧时间一致；点击「逐帧放大」查看单帧配对。
              </p>
            </div>
            <div id="view-frames" role="tabpanel" hidden>
              <div class="frame-selector" id="frame-selector"></div>
              <div id="frame-pair" class="pair"></div>
            </div>
            <div id="view-videos" role="tabpanel" hidden>
              <div class="pair">
                <figure>
                  <figcaption class="reference">GT · Reference</figcaption>
                  <video
                    id="gt-video"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>
                </figure>
                <figure>
                  <figcaption class="generated">Gen · Generated</figcaption>
                  <video
                    id="gen-video"
                    muted
                    playsinline
                    preload="metadata"
                  ></video>
                </figure>
              </div>
              <div class="video-controls">
                <button id="play" disabled>同步播放</button
                ><input
                  id="seek"
                  type="range"
                  min="0"
                  max="1"
                  step="0.001"
                  value="0"
                  aria-label="视频时间"
                  disabled
                /><output id="video-time">0.000 s</output
                ><select id="speed" aria-label="播放速度">
                  <option value="0.5">0.5×</option>
                  <option value="1" selected>1×</option>
                  <option value="2">2×</option>
                </select>
              </div>
              <p id="video-error" class="small muted" role="status"></p>
            </div>
          </section>
          <section class="judgments">
            <div class="section-heading">
              <h2>具体指标与证据</h2>
              <a id="raw-json" target="_blank" rel="noopener"
                >查看原始结果 JSON ↗</a
              >
            </div>
            <div id="judgment-sections"></div>
          </section>
        </div>
      </main>
    </div>
    <dialog id="sheet-dialog">
      <div class="dialog-toolbar">
        <strong>GT / Gen · 完整分辨率对照</strong
        ><button id="close-dialog">关闭 ✕</button>
      </div>
      <div class="dialog-scroll">
        <figure>
          <figcaption class="reference">GT · Reference</figcaption>
          <img id="dialog-gt" alt="完整 GT 拼图" />
        </figure>
        <figure>
          <figcaption class="generated">Gen · Generated</figcaption>
          <img id="dialog-gen" alt="完整 Gen 拼图" />
        </figure>
      </div>
    </dialog>
  </body>
</html>

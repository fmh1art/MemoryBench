[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybench"
version = "2.1.0"
description = "Action-conditioned world model memory evaluation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2", "av>=18", "Pillow>=11", "numpy>=2", "imageio>=2"]

[tool.setuptools.packages.find]
include = ["evaluation*", "mem_case_anno_demo*"]

[tool.setuptools.package-data]
evaluation = ["common.md", "memory_common.md", "README.md", "cases.example.json", "*/rubric.md", "viewer/static/*"]
mem_case_anno_demo = ["static/*"]

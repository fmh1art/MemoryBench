[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybench"
version = "2.1.0"
description = "Action-conditioned world model memory evaluation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2", "av>=18", "Pillow>=11", "numpy>=2", "imageio>=2"]

[project.optional-dependencies]
annotation = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2,<4", "pyarrow>=14", "mcap>=1.2,<2", "protobuf>=4.25,<8"]
pairwise = ["fastapi>=0.115,<1", "starlette>=0.49.1,<2", "uvicorn>=0.30,<1", "scipy>=1.14,<2"]
pairwise-model = ["scipy>=1.14,<2", "PyYAML>=6,<7"]
automated = ["scipy>=1.14"]
automated-perceptual = ["scipy>=1.14", "torch>=2.2", "torchvision>=0.17", "lpips>=0.1.4"]
automated-quality = ["scipy>=1.14", "pyiqa>=0.1.13"]

[tool.setuptools.packages.find]
include = ["evaluation*", "mem_case_anno_demo*"]

[tool.setuptools.package-data]
evaluation = ["common.md", "memory_common.md", "README.md", "cases.example.json", "*/rubric.md", "automated/README.md", "source_annotation/PROMPT.md", "source_annotation/README.md", "pairwise/static/*", "pairwise/README.md", "pairwise/study.example.json", "pairwise/requirements.txt", "pairwise/run.sh"]
mem_case_anno_demo = ["static/*", "LIGHTWHEEL.md"]
